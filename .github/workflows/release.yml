name: Publish desktop release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [release/VERSION, .github/workflows/release.yml]

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Smoke test
        run: node --test tests/web.mjs
      - name: Check Windows package
        run: python tests/release.py
      - name: Create tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(cat release/VERSION)"
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already exists"
            exit 0
          fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "SRT Studio $tag" \
            --notes-file "release/$tag.md" \
            "docs/downloads/SRT-Studio-${tag#v}-Windows.zip" "docs/downloads/SRT-Studio-${tag#v}-Windows.sha256"
